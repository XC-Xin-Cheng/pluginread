pluginManagement {
	repositories {
		// 本地预取的 fabricmc 构件（maven.fabricmc.net 被限速时的离线替代）
		maven {
			name = 'FabricLocal'
			url = uri(new File(rootDir, 'local-fabric-maven'))
		}
		maven {
			name = 'Aliyun'
			url = 'https://maven.aliyun.com/repository/public'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'pluginread'
